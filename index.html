<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:#161616;--ink:#F2F2F2;--mute:#9A9A9A;--line:#333;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Times New Roman",Times,serif;font-size:18px;line-height:1.7;background:radial-gradient(ellipse at 50% 38%,#242424 0%,#161616 62%) fixed;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.fql{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.fq{position:absolute;left:0;white-space:nowrap;font-style:italic;color:#fff;opacity:.11;transform:translateX(105vw);animation:drift linear infinite}
@keyframes drift{to{transform:translateX(-130%)}}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;background:rgba(22,22,22,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #262626}
.mk{height:38px;width:auto;display:block}
.hr{display:flex;align-items:center;gap:12px}
.snd{width:40px;height:40px;border-radius:50%;border:1px solid #3a3a3a;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:border-color .3s}
.snd:hover{border-color:#fff}
.snd svg{width:19px;height:19px}
.snd .x{opacity:1}.snd[aria-pressed=true] .x{opacity:0}
.cbtn{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:10px;padding:10px 24px;border-radius:999px;color:#fff;text-decoration:none;font-size:1rem;letter-spacing:.06em;overflow:hidden}
.cbtn::before{content:"";position:absolute;inset:0;z-index:-2;background:conic-gradient(from var(--a),#3a3a3a 0 55%,#fff 78%,#3a3a3a 100%);animation:spin 3.2s linear infinite}
.cbtn::after{content:"";position:absolute;inset:1.5px;z-index:-1;border-radius:999px;background:#161616;transition:background .4s}
.cbtn:hover::after{background:#222}
.cbtn i{position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:sh 4.5s ease-in-out infinite}
.cbtn svg{width:16px;height:16px;transition:transform .35s}
.cbtn:hover svg{transform:translate(4px,-4px)}
@keyframes spin{to{--a:360deg}}
@keyframes sh{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
main{position:relative;z-index:2}
.hero{min-height:calc(100svh - 62px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px 60px}
.hero img{width:min(230px,56vw);height:auto;animation:rise 1.8s ease both;filter:drop-shadow(0 0 28px rgba(255,255,255,.12))}
.hero p{margin:30px 0 0;color:var(--mute);letter-spacing:.32em;font-size:.92rem;animation:rise 1.8s .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.quotes{padding:70px 24px 90px;text-align:center;border-top:1px solid #262626}
.quotes h2{font-weight:400;font-size:1rem;letter-spacing:.3em;color:var(--mute);margin:0 0 34px}
.qs{display:grid;max-width:640px;margin:0 auto}
.qs blockquote{grid area:1/1;grid-area:1/1;margin:0;opacity:0;transition:opacity 1.4s ease}
.qs blockquote.on{opacity:1}
.qs p{font-size:clamp(1.4rem,5.2vw,2rem);line-height:1.45;font-style:italic;margin:0 0 16px}
.qs cite{font-style:normal;color:var(--mute);font-size:.95rem}
.qs .bn{font-style:normal}
footer{position:relative;z-index:2;text-align:center;color:#6a6a6a;font-size:.9rem;padding:20px 0 44px}
.sky{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.el{position:absolute;left:0;animation:walk linear infinite alternate}
@keyframes walk{from{transform:translateX(-24vw)}to{transform:translateX(112vw)}}
.fl{animation:flip linear infinite;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
@keyframes flip{0%,49.99%{transform:scaleX(1)}50%,100%{transform:scaleX(-1)}}
.el svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
.bob{animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.leg,.trunk{transform-box:fill-box}
.leg{transform-origin:50% 0;animation:step .7s ease-in-out infinite alternate}
.l2,.l3{animation-direction:alternate-reverse}
@keyframes step{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.trunk{transform-origin:0 0;transition:transform .3s ease}
.say{position:absolute;top:-26px;left:62%;color:#fff;font-style:italic;font-size:.95rem;opacity:0;transition:opacity .25s;white-space:nowrap;text-shadow:0 1px 6px #000}
.el.up .trunk{transform:rotate(-105deg)}
.el.up .say{opacity:.9}
@media (prefers-reduced-motion:reduce){
 .fql{display:none}.cbtn::before{animation:none}.cbtn i{display:none}
 .el,.fl,.bob,.leg{animation:none}.hero img,.hero p{animation:none}
}
</style>
</head>
<body>
<div class="fql" id="fql" aria-hidden="true"></div>
